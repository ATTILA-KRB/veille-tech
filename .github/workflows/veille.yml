name: Veille tech

on:
  schedule:
    # 06:00 UTC = 08:00 Paris (ete) / 07:00 (hiver). Cron GitHub en UTC.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:          # bouton de lancement manuel

permissions:
  contents: write             # necessaire pour commiter le rapport

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # garde-fou : un run normal dure 1 a 2 min
    steps:
      - name: Recuperer le repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install feedparser anthropic

      - name: Generer le digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p reports
          python veille.py --hours 24 --out "reports/veille_$(date +%F).md"

      - name: Commiter le rapport
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Veille $(date +%F)"
          git push

      - name: Publier en artifact
        uses: actions/upload-artifact@v4
        with:
          name: veille-${{ github.run_id }}
          path: reports/*.md
          retention-days: 30
