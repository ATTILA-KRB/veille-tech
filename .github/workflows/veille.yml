name: Veille tech

on:
  schedule:
    # 06:17 UTC ~ 08:17 Paris (ete) / 07:17 (hiver). Cron GitHub en UTC.
    # Minute decalee du top d'heure : les crons a HH:00 sont les plus souvent
    # retardes ou sautes par le planificateur GitHub (best effort).
    - cron: "17 6 * * 1-5"
  workflow_dispatch:          # bouton de lancement manuel

permissions:
  contents: write             # necessaire pour commiter le rapport

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # garde-fou : un run normal dure 1 a 2 min
    env:
      # Expose le secret en variable pour tester sa presence dans un "if".
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - name: Recuperer le repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install feedparser anthropic

      - name: Date du jour
        run: echo "REPORT_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Generer le digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p reports
          python veille.py --hours 24 --out "reports/veille_${REPORT_DATE}.md"

      # L'envoi du mail est place AVANT le commit : la livraison du digest
      # ne depend donc pas du succes du "git push".
      - name: Envoyer le digest par mail
        # Ne s'execute que si le secret MAIL_USERNAME est configure (sinon : ignore).
        if: success() && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Veille tech — ${{ env.REPORT_DATE }}"
          to: ${{ secrets.MAIL_USERNAME }}
          from: "Veille tech <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://reports/veille_${{ env.REPORT_DATE }}.md
          convert_markdown: true       # rend le Markdown du rapport en HTML
          attachments: reports/veille_${{ env.REPORT_DATE }}.md

      - name: Commiter le rapport
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "Aucun changement a committer."
            exit 0
          fi
          git commit -m "Veille ${REPORT_DATE}"
          # Pousse en absorbant une eventuelle avance concurrente de la branche
          # (runs qui se chevauchent, push externe...) : rebase puis nouvelle tentative.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejete, rebase sur l'etat distant puis nouvelle tentative ($attempt/3)..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "Echec du push du rapport apres 3 tentatives." >&2
          exit 1

      - name: Publier en artifact
        if: always()                   # garde l'artifact meme si une etape precedente echoue
        uses: actions/upload-artifact@v4
        with:
          name: veille-${{ github.run_id }}
          path: reports/*.md
          retention-days: 30
